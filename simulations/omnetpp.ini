# =============================================================================
#  omnetpp.ini — Projet Stigmergie Multi-Domaine v1.0
#  Coordination Stigmergique Distribuée pour Déception Multi-Domaine
#
#  Université de Dschang — projet.stigmergie@univ-dschang.org
#  Document de référence : simulation_conf1.pdf  §4 §5
#
#  Structure de ce fichier :
#    [General]          Paramètres globaux, INET, stigmergie, enregistrement
#    [Config Baseline_*]  5 baselines de comparaison (§8 du document)
#    [Config E1_*]      Validation synchronisation sans pertes (RQ3, RQ6)
#    [Config E2_*]      Adaptativité attention adverse      (RQ4, RQ5)
#    [Config E3_*]      Robustesse réseau dégradé           (RQ5)
#    [Config E4_*]      Résilience pannes nœuds             (RQ5, RQ6)
#    [Config E5_*]      Scalabilité  |D| ∈ {3,6,9,12}      (RQ1, RQ6)
#
#  Lancement d'une expérience :
#    opp_run -c E1_Proposed -r 0..29 stigmergie
#
#  Lancement en batch (SLURM) :
#    opp_run -c E3_Proposed -r 0..29 -j8 stigmergie
#
#  Export CSV après simulation :
#    opp_scavetool export -f "name =~ beliefEntropy" \
#        results/raw/vectors-E1_Proposed-*.vec -o results/processed/E1.csv
# =============================================================================


# =============================================================================
# [General] — Paramètres communs à toutes les configurations
# =============================================================================
[General]
network           = stigmergie.StigmergyNetwork

# Chargement explicite du binaire du projet
# Nécessaire quand opp_run ne trouve pas les classes Define_Module()
sim-time-limit    = 200s          # horizon_T = 200 pas (§4 experiment.horizon_T)
repeat            = 30            # n_runs = 30            (§4 experiment.n_runs)
seed-set          = ${repetition} # Seed déterministe par run
#warmup-period    = 10s           # Décommenter si nécessaire

# ── Reproductibilité (§9 "Résultats non reproductibles") ────────────────────
# Le seed est fixé globalement ; chaque module appelle uniform()/exponential()
# avec le RNG de son module — reproductible si seed-set = ${repetition}.
num-rngs          = 4
**.rng-0          = 0   # RNG principal (phéromones, croyances)
**.rng-1          = 1   # RNG réseau    (pertes, jamming)
**.rng-2          = 2   # RNG pannes    (failure timer)
**.rng-3          = 3   # RNG mobilité  (E5)


# =============================================================================
# Couche physique INET — 802.11 ad-hoc
# =============================================================================

# Medium radio partagé
*.radioMedium.typename                        = "Ieee80211ScalarRadioMedium"
*.radioMedium.backgroundNoise.power           = -110dBm
*.radioMedium.propagation.typename            = "ConstantSpeedPropagation"
*.radioMedium.propagation.propagationSpeed    = 3e8mps  # vitesse lumière

# Interface radio de chaque nœud
*.domain[*].wlan[0].typename                  = "Ieee80211Interface"
*.domain[*].wlan[0].radio.typename            = "Ieee80211ScalarRadio"
*.domain[*].wlan[0].radio.transmitter.power   = 20mW
*.domain[*].wlan[0].radio.transmitter.bitrate = 11Mbps
*.domain[*].wlan[0].radio.receiver.sensitivity       = -85dBm
*.domain[*].wlan[0].radio.receiver.snirThreshold     = 4dB
*.domain[*].wlan[0].radio.centerFrequency            = 2.4GHz
*.domain[*].wlan[0].radio.bandwidth                  = 20MHz

# Mode ad-hoc (pas d'AP)
*.domain[*].wlan[0].mac.typename              = "Ieee80211Mac"
*.domain[*].wlan[0].mac.modeSet              = "g(mixed)"
*.domain[*].wlan[0].mgmt.typename            = "Ieee80211MgmtAdhoc"
*.domain[*].wlan[0].agent.typename           = ""

# Mobilité : nœuds stationnaires par défaut (mesh fixe)
*.domain[*].mobility.typename                = "StationaryMobility"
*.domain[*].mobility.constraintAreaMinX      = 0m
*.domain[*].mobility.constraintAreaMinY      = 0m
*.domain[*].mobility.constraintAreaMaxX      = 900m
*.domain[*].mobility.constraintAreaMaxY      = 700m

# Positions hexagonales (D=6) — cf. StigmergyNetwork.ned
*.domain[0].mobility.initialX = 450m   # Cyber    (centre)
*.domain[0].mobility.initialY = 350m
*.domain[1].mobility.initialX = 450m   # Air      (nord)
*.domain[1].mobility.initialY = 160m
*.domain[2].mobility.initialX = 620m   # Sol      (nord-est)
*.domain[2].mobility.initialY = 255m
*.domain[3].mobility.initialX = 620m   # Maritime (sud-est)
*.domain[3].mobility.initialY = 445m
*.domain[4].mobility.initialX = 450m   # Spatial  (sud)
*.domain[4].mobility.initialY = 540m
*.domain[5].mobility.initialX = 280m   # EM       (sud-ouest)
*.domain[5].mobility.initialY = 445m


# =============================================================================
# Paramètres réseau niveau simulation
# =============================================================================
*.numDomains      = 6
*.packetLoss      = 0.0
*.jammingProb     = 0.0
*.nodeFailureRate = 0.0
*.syncIntervalSec = 2.0


# =============================================================================
# Paramètres DomainNode — Stigmergie (§4 default.yaml)
# =============================================================================

# Champ phéromonal
*.domain[*].rhoP            = 0.1   # ρ_p : taux d'évaporation
*.domain[*].xi              = 0.5   # ξ   : poids gradient local
*.domain[*].omegaDefault    = 0.8   # ω   : fiabilité liens voisins
*.domain[*].thetaTau        = 0.7   # θ_τ : seuil suspicion narrative
*.domain[*].quorumRatio     = 0.6   # Fraction quorum pour rotation
*.domain[*].rotationCooldown = 5    # Pas min entre rotations

# Budget et coûts unitaires κ_d (§4 deception.cost_per_unit = [1,2,1.5,2,3,1])
*.domain[*].budgetTotal     = 100.0
*.domain[0].costPerUnit     = 1.0   # Cyber
*.domain[1].costPerUnit     = 2.0   # Air
*.domain[2].costPerUnit     = 1.5   # Sol
*.domain[3].costPerUnit     = 2.0   # Maritime
*.domain[4].costPerUnit     = 3.0   # Spatial
*.domain[5].costPerUnit     = 1.0   # EM

# Narratives
*.domain[*].narrativeOptions  = "A B C"   # §4 deception.narrative_options

# Modèle adversaire (§4 adversary.yaml)
*.domain[*].beliefInit          = "uniform"
*.domain[*].suspicionThreshold  = 0.3
*.domain[*].probingIntensity    = "adaptive"
*.domain[*].gnnHiddenDim        = 16
*.domain[*].attentionLr         = 0.01

# Synchronisation
*.domain[*].syncIntervalSec     = 2.0


# =============================================================================
# Paramètres PheromoneField (module global)
# =============================================================================
*.pheromoneField.numDomains     = 6
*.pheromoneField.rhoP           = 0.1
*.pheromoneField.omegaDefault   = 0.8
*.pheromoneField.diffAlpha      = 0.05    # Coefficient diffusion spatiale
*.pheromoneField.depositClamp   = 0.3     # Amplitude max dépôt Δ_d
*.pheromoneField.noiseAmplitude = 0.05    # Amplitude bruit adversarial
*.pheromoneField.jammingProb    = 0.0     # Surchargé dans E3
*.pheromoneField.enableDiffusion = true
*.pheromoneField.evapPeriod     = 2.0


# =============================================================================
# Paramètres AdversaryModel
# =============================================================================
*.adversary.numDomains         = 6
*.adversary.beliefInit         = "uniform"
*.adversary.gnnHiddenDim       = 16
*.adversary.attentionLr        = 0.01
*.adversary.suspicionThreshold = 0.3
*.adversary.probingIntensity   = "adaptive"
*.adversary.updatePeriod       = 2.0

# =============================================================================
# Paramètres MetricsCollector
# =============================================================================
*.metricsCollector.numDomains    = 6
*.metricsCollector.outputDir     = "results/processed"
*.metricsCollector.collectPeriod = 10.0
*.metricsCollector.hThresh       = 1.0
*.metricsCollector.omegaEpsilon  = 0.05
*.metricsCollector.writeCSV      = true


# =============================================================================
# Enregistrement des résultats
# §4 experiment.save_every = 10
# =============================================================================
result-dir              = ${ini}/../results/raw
output-scalar-file      = ${resultdir}/scalars-${configname}-${repetition}.sca
output-vector-file      = ${resultdir}/vectors-${configname}-${repetition}.vec
output-vector-precision = 9   # Précision décimale des vecteurs

# Enregistrement sélectif pour limiter la taille des fichiers
# Tous les scalaires (moyennes finales) → toujours activés
**.scalar-recording = true

# Vecteurs temporels → activés uniquement pour les signaux définis ci-dessous
**.vector-recording = false

# ── Results A — Déception ────────────────────────────────────────────────────
**.deceptionEffort.vector-recording      = true
**.pheromoneLevel.vector-recording       = true
**.beliefEntropy.vector-recording        = true
**.falseGoalInduction.vector-recording   = true
**.deceptionPersistence.vector-recording = true
**.timeToSuspicion.vector-recording      = true

# ── Results B — Coordination ─────────────────────────────────────────────────
**.consistencyViolation.vector-recording  = true
**.narrativeDivergence.vector-recording   = true
**.syncDelay.vector-recording             = true
**.quorumTriggerSuccess.vector-recording  = true

# ── Results C — Réseau / Sécurité ────────────────────────────────────────────
**.commOverhead.vector-recording   = true
**.infoLeak.vector-recording       = true
**.spoofDetection.vector-recording = true

# ── Results D — Robustesse ───────────────────────────────────────────────────
**.performanceDrop.vector-recording     = true
**.gracefulDegradation.vector-recording = true

# ── PheromoneField global ────────────────────────────────────────────────────
**.fieldEntropy.vector-recording       = true
**.globalConsistency.vector-recording  = true
**.fieldNorm.vector-recording          = true
**.evaporationLoss.vector-recording    = true

# Intervalle d'enregistrement : toutes les 10s (§4 save_every=10)


# =============================================================================
# Visualiseur INET (désactivé en batch pour performances)
# =============================================================================
*.visualizer.*.displayLinks              = false
*.visualizer.*.displayRoutingTables      = false
*.visualizer.*.displayPacketDrops        = false
*.visualizer.*.mediumVisualizer.typename = ""


# =============================================================================
#  BASELINES DE COMPARAISON (§8 du document)
#
#  B1 — Centralized PPO      : borne supérieure théorique
#  B2 — Static Allocation    : x_d^t = B_t/|D|  (naïf)
#  B3 — Independent          : aucun échange inter-domaine
#  B4 — GNN-Coordinated      : synchronisation périodique requise
#  B5 — Proposed Stigmergic  : notre méthode (référence principale)
#
#  Toutes les baselines tournent sur le même réseau idéal (E1 conditions).
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# B1 — Centralized PPO  (borne supérieure : observation globale parfaite)
# ─────────────────────────────────────────────────────────────────────────────
[Config Baseline_CentralizedPPO]
description     = "B1 - Centralized PPO : borne superieure theorique"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0

# Le contrôleur centralisé voit tous les τ_d simultanément.
# Modélisé par un syncInterval très court (≈ parfait)
# et un coefficient xi=1.0 (gradient global appliqué instantanément).
*.domain[*].xi              = 1.0
*.domain[*].syncIntervalSec = 0.1   # Synchronisation quasi-instantanée
*.domain[*].probingIntensity = "adaptive"

# Pas de contrainte de quorum : décision centralisée
*.domain[*].quorumRatio     = 0.0
*.domain[*].rotationCooldown = 0

# PheromoneField : évaporation nulle (contrôleur maintient le champ parfait)
*.pheromoneField.rhoP        = 0.0
*.pheromoneField.enableDiffusion = true
*.pheromoneField.diffAlpha   = 1.0   # Homogénéisation parfaite en 1 tick


# ─────────────────────────────────────────────────────────────────────────────
# B2 — Static Allocation  x_d^t = B_t / |D|  (allocation naïve fixe)
# ─────────────────────────────────────────────────────────────────────────────
[Config Baseline_StaticAllocation]
description     = "B2 - Static Allocation : x_d = Bt/D constant"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0

# Désactiver la dynamique phéromonale : τ_d figé à 1/D
*.domain[*].xi              = 0.0   # Aucune mise à jour locale
*.domain[*].rhoP            = 0.0   # Pas d'évaporation
*.domain[*].syncIntervalSec = 999s  # Synchronisation quasi-désactivée
*.domain[*].quorumRatio     = 1.1   # Quorum impossible → jamais de rotation

# Budget égal pour tous les domaines
*.domain[*].budgetTotal     = 100.0
# costPerUnit identique → x_d = 100/6 ≈ 16.67 pour tous
*.domain[0].costPerUnit     = 1.0
*.domain[1].costPerUnit     = 1.0
*.domain[2].costPerUnit     = 1.0
*.domain[3].costPerUnit     = 1.0
*.domain[4].costPerUnit     = 1.0
*.domain[5].costPerUnit     = 1.0

*.pheromoneField.rhoP       = 0.0
*.pheromoneField.enableDiffusion = false


# ─────────────────────────────────────────────────────────────────────────────
# B3 — Independent Deception  (aucun échange inter-domaine — borne inférieure)
# ─────────────────────────────────────────────────────────────────────────────
[Config Baseline_Independent]
description     = "B3 - Independent : aucun echange inter-domaine"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0

# Chaque domaine agit uniquement sur son gradient local, sans lire les voisins.
# Modélisé par : réception UDP désactivée (port fermé) + diffusion nulle.
*.domain[*].xi              = 0.5   # Gradient local conservé
*.domain[*].omegaDefault    = 0.0   # Fiabilité voisins = 0 → ignorés
*.domain[*].quorumRatio     = 1.1   # Quorum impossible sans communication
*.domain[*].syncIntervalSec = 2.0

# PheromoneField : pas de diffusion (pas de couplage spatial)
*.pheromoneField.enableDiffusion = false
*.pheromoneField.diffAlpha       = 0.0


# ─────────────────────────────────────────────────────────────────────────────
# B4 — GNN-Coordinated  (état de l'art : synchronisation périodique)
# ─────────────────────────────────────────────────────────────────────────────
[Config Baseline_GNNCoordinated]
description     = "B4 - GNN-Coordinated : synchronisation periodique requise"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0

# Le GNN requiert une synchronisation globale périodique.
# Modélisé par un syncInterval long (= période GNN) et une diffusion forte.
*.domain[*].syncIntervalSec = 10s   # Synchronisation toutes les 10s (batch)
*.domain[*].xi              = 0.8   # Gradient renforcé par attention GNN
*.domain[*].omegaDefault    = 0.9   # Fiabilité liens élevée (GNN calibré)
*.domain[*].quorumRatio     = 0.5   # Quorum moins strict (GNN vérifie)

# GNN : paramètres du mécanisme d'attention (couplage Python externe)
*.domain[*].gnnHiddenDim    = 16
*.domain[*].attentionLr     = 0.01

# PheromoneField : diffusion forte à chaque période GNN
*.pheromoneField.enableDiffusion = true
*.pheromoneField.diffAlpha       = 0.3   # Homogénéisation forte par période
*.pheromoneField.evapPeriod      = 10   # Synchronisé avec syncInterval GNN


# ─────────────────────────────────────────────────────────────────────────────
# B5 — Proposed Stigmergic  (notre méthode — configuration de référence)
# Identique à [General] + réseau idéal → utilisé comme base pour E1-E5
# ─────────────────────────────────────────────────────────────────────────────
[Config Baseline_Proposed]
description     = "B5 - Proposed Stigmergic : notre methode (reference)"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0
# Tous les paramètres par défaut de [General] s'appliquent.


# =============================================================================
#  EXPÉRIENCE E1 — Validation synchronisation sans pertes
#  RQ3 (émergence coordination), RQ6 (overhead minimal)
#  Durée estimée : 2h   |   n_runs = 30   |   D = 6
#
#  Objectif : montrer que le protocole stigmergique converge et maintient
#  H(b_t) > H_thresh sans contrôleur central, en réseau idéal.
#
#  Comparaison : proposé vs 4 baselines → Fig. 4 (courbes H(b_t) vs t)
# =============================================================================

[Config E1_CentralizedPPO]
description = "E1 - Baseline B1 (Centralized PPO) reseau ideal"
extends     = Baseline_CentralizedPPO

[Config E1_StaticAllocation]
description = "E1 - Baseline B2 (Static Allocation) reseau ideal"
extends     = Baseline_StaticAllocation

[Config E1_Independent]
description = "E1 - Baseline B3 (Independent) reseau ideal"
extends     = Baseline_Independent

[Config E1_GNNCoordinated]
description = "E1 - Baseline B4 (GNN-Coordinated) reseau ideal"
extends     = Baseline_GNNCoordinated

[Config E1_Proposed]
description = "E1 - Proposed Stigmergic reseau ideal (RQ3 RQ6)"
extends     = Baseline_Proposed
# Paramètres par défaut : packet_loss=0.0, jamming=0.0, D=6, n_runs=30


# =============================================================================
#  EXPÉRIENCE E2 — Adaptativité à l'attention adverse
#  RQ4 (adaptation au shift), RQ5 (robustesse adversariale)
#  Durée estimée : 3h   |   n_runs = 30   |   D = 6
#
#  Protocole : l'adversaire change de stratégie de sondage à t=100s
#  (probing_intensity = "shift_at_t100").
#  On mesure la vitesse de récupération de H(b_t) après le shift.
#
#  Métriques clés : time_to_suspicion, deception_persistence après t=100
# =============================================================================

[Config E2_CentralizedPPO]
description = "E2 - Baseline B1 avec shift adverse a t=100s"
extends     = Baseline_CentralizedPPO
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_StaticAllocation]
description = "E2 - Baseline B2 avec shift adverse a t=100s"
extends     = Baseline_StaticAllocation
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_Independent]
description = "E2 - Baseline B3 avec shift adverse a t=100s"
extends     = Baseline_Independent
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_GNNCoordinated]
description = "E2 - Baseline B4 avec shift adverse a t=100s"
extends     = Baseline_GNNCoordinated
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_Proposed]
description = "E2 - Proposed Stigmergic avec shift adverse a t=100s (RQ4 RQ5)"
extends     = Baseline_Proposed
*.domain[*].probingIntensity = "shift_at_t100"


# =============================================================================
#  EXPÉRIENCE E3 — Robustesse réseau dégradé
#  RQ5 (robustesse aux perturbations réseau)
#  Durée estimée : 4h   |   n_runs = 30   |   D = 6
#
#  Grille paramétrique :
#    packet_loss ∈ {0.1, 0.3}  ×  jamming ∈ {0.0, 0.2}
#    = 4 combinaisons × 5 méthodes × 30 runs = 600 simulations
#
#  Métriques clés : Fig. 5 (boxplots false_goal_induction_rate)
#                   Fig. 6 (heatmap consistency_violation vs pl × jamming)
# =============================================================================

# Macro commune E3 : active les modèles de pertes et le jamming
# Utilisée par extends dans chaque config E3_*
[Config E3_Base]
extends         = General
*.packetLoss    = ${pl=0.1, 0.3}
*.jammingProb   = ${jp=0.0, 0.2}

# Modèle de pertes bit/paquet sur le lien radio
*.domain[*].wlan[0].radio.errorModel.typename  = "Ieee80211NistErrorModel"

# Jamming : réduction de la sensibilité du récepteur proportionnelle à jp
# Sensibilité de base : -85 dBm  |  Dégradation : -20 dB × jp
*.domain[*].wlan[0].radio.receiver.sensitivity = \
    ${sens = -85, -89, -85, -89}dBm   # pl=0.1/jp=0, pl=0.3/jp=0, pl=0.1/jp=0.2, pl=0.3/jp=0.2

# PheromoneField : jamming sur le champ global
*.pheromoneField.jammingProb    = ${jp}
*.pheromoneField.noiseAmplitude = 0.05

# Enregistrement supplémentaire : dérive du champ phéromonal
**.tau_drift.vector-recording    = true
**.adversarialNoise.vector-recording = true

[Config E3_CentralizedPPO]
description = "E3 - Baseline B1 reseau degrade"
extends     = E3_Base, Baseline_CentralizedPPO
*.domain[*].xi              = 1.0
*.domain[*].syncIntervalSec = 0.1

[Config E3_StaticAllocation]
description = "E3 - Baseline B2 reseau degrade"
extends     = E3_Base, Baseline_StaticAllocation

[Config E3_Independent]
description = "E3 - Baseline B3 reseau degrade"
extends     = E3_Base, Baseline_Independent

[Config E3_GNNCoordinated]
description = "E3 - Baseline B4 reseau degrade"
extends     = E3_Base, Baseline_GNNCoordinated

[Config E3_Proposed]
description = "E3 - Proposed Stigmergic reseau degrade (RQ5)"
extends     = E3_Base, Baseline_Proposed


# =============================================================================
#  EXPÉRIENCE E4 — Résilience aux pannes de nœuds
#  RQ5 (robustesse pannes), RQ6 (dégradation gracieuse)
#  Durée estimée : 3h   |   n_runs = 30   |   D = 6
#
#  Protocole : fraction node_failure ∈ {0.1, 0.2, 0.4} des nœuds
#  tombent à un instant aléatoire t ~ Uniform(20s, 180s).
#  On mesure ΔH(b_T) = H avant panne − H après stabilisation.
#
#  Métriques clés : performance_drop_node_failure, graceful_degradation_slope
# =============================================================================

[Config E4_Base]
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0
*.nodeFailureRate = ${nf=0.1, 0.2, 0.4}

# Activer le lifecycle NodeStatus pour les pannes propres
*.domain[*].hasStatus   = true

# Enregistrement supplémentaire pour Results D
**.performanceDrop.vector-recording     = true
**.gracefulDegradation.vector-recording = true

[Config E4_CentralizedPPO]
description = "E4 - Baseline B1 avec pannes noeuds"
extends     = E4_Base, Baseline_CentralizedPPO

[Config E4_StaticAllocation]
description = "E4 - Baseline B2 avec pannes noeuds"
extends     = E4_Base, Baseline_StaticAllocation

[Config E4_Independent]
description = "E4 - Baseline B3 avec pannes noeuds"
extends     = E4_Base, Baseline_Independent

[Config E4_GNNCoordinated]
description = "E4 - Baseline B4 avec pannes noeuds"
extends     = E4_Base, Baseline_GNNCoordinated

[Config E4_Proposed]
description = "E4 - Proposed Stigmergic avec pannes noeuds (RQ5 RQ6)"
extends     = E4_Base, Baseline_Proposed


# =============================================================================
#  EXPÉRIENCE E5 — Scalabilité
#  RQ1 (overhead constant), RQ6 (passage à l'échelle)
#  Durée estimée : 4h   |   n_runs = 30   |   D ∈ {3, 6, 9, 12}
#
#  Hypothèse à vérifier : comm_overhead ≈ O(D) et non O(D²)
#  (Fig. 7 : comm_overhead vs |D|, notre méthode ≈ linéaire / constante)
#
#  Pour D > 6 : positions aléatoires, topologie anneau + étoile auto-générée
# =============================================================================

[Config E5_Base]
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0
*.numDomains    = ${nd=3, 6, 9, 12}

# Mettre à jour PheromoneField avec le bon D
*.pheromoneField.numDomains  = ${nd}
*.adversary.numDomains       = ${nd}
*.metricsCollector.numDomains = ${nd}

# Pour D > 6 : positions aléatoires stationnaires dans la zone 900×700
*.domain[*].mobility.typename   = "StationaryMobility"
*.domain[*].mobility.initialX   = uniform(80m, 820m)
*.domain[*].mobility.initialY   = uniform(80m, 620m)

# Coût unitaire uniforme pour tous (scalabilité pure, sans biais κ_d)
*.domain[*].costPerUnit = 1.5   # Valeur médiane du tableau κ_d

# Activation de l'enregistrement overhead (Fig. 7)
**.commOverhead.vector-recording = true
**.fieldNorm.vector-recording    = true

[Config E5_CentralizedPPO]
description = "E5 - Baseline B1 scalabilite |D| in {3,6,9,12}"
extends     = E5_Base, Baseline_CentralizedPPO
*.domain[*].xi              = 1.0
*.domain[*].syncIntervalSec = 0.1

[Config E5_StaticAllocation]
description = "E5 - Baseline B2 scalabilite |D| in {3,6,9,12}"
extends     = E5_Base, Baseline_StaticAllocation

[Config E5_Independent]
description = "E5 - Baseline B3 scalabilite |D| in {3,6,9,12}"
extends     = E5_Base, Baseline_Independent

[Config E5_GNNCoordinated]
description = "E5 - Baseline B4 scalabilite |D| in {3,6,9,12}"
extends     = E5_Base, Baseline_GNNCoordinated

[Config E5_Proposed]
description = "E5 - Proposed Stigmergic scalabilite |D| in {3,6,9,12} (RQ1 RQ6)"
extends     = E5_Base, Baseline_Proposed


# =============================================================================
#  CONFIGURATIONS DE DÉBOGAGE (ne pas utiliser en production)
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Debug_Quick : 1 run, horizon 20s, logs verbeux — §10 checklist départ
# "Exécuter run_proposed.py avec n_runs=1, horizon_T=20"
# ─────────────────────────────────────────────────────────────────────────────
[Config Debug_Quick]
description     = "DEBUG - 1 run, 20s, logs verbeux"
extends         = General
sim-time-limit  = 20s
repeat          = 1
seed-set        = 42

# Logs détaillés pour vérifier la logique phéromonale
**.cmdenv-log-level = detail
*.domain[*].cmdenv-log-level = detail
*.pheromoneField.cmdenv-log-level = detail

# Enregistrement de tous les vecteurs pour inspection
**.vector-recording = true

*.packetLoss    = 0.0
*.jammingProb   = 0.0

# ─────────────────────────────────────────────────────────────────────────────
# Debug_ValidateTopology : vérifie que tous les nœuds se voient (§9)
# "Exécuter validate_topology.py" → équivalent OMNeT++
# ─────────────────────────────────────────────────────────────────────────────
[Config Debug_ValidateTopology]
description     = "DEBUG - Validation topologie : tous les noeuds doivent se voir"
extends         = General
sim-time-limit  = 10s
repeat          = 1
seed-set        = 42

# Activer le visualiseur pour inspection dans l'IDE
*.visualizer.*.displayLinks             = true
*.visualizer.*.displayRoutingTables     = true
*.visualizer.mediumVisualizer.typename  = "MediumCanvasVisualizer"
*.visualizer.mediumVisualizer.displayCommunicationRanges = true

*.packetLoss    = 0.0
*.jammingProb   = 0.0

# ─────────────────────────────────────────────────────────────────────────────
# Debug_SeedCheck : vérifie la reproductibilité sur 3 runs identiques
# "Ajouter torch.manual_seed(seed)" → équivalent pour vérifier les RNGs
# ─────────────────────────────────────────────────────────────────────────────
[Config Debug_SeedCheck]
description     = "DEBUG - Reproductibilite : 3 runs avec seed=42 doivent donner H identiques"
extends         = General
sim-time-limit  = 50s
repeat          = 3
seed-set        = 42   # FIXE pour tous les runs → résultats identiques

*.packetLoss    = 0.0
*.jammingProb   = 0.0
