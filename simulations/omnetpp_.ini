# =============================================================================
#  omnetpp.ini — Projet Stigmergie Multi-Domaine v1.0
#  PATCHED : suppression des configs INET (wlan, mobility, radioMedium)
#  incompatibles avec simple DomainNode (sendDirect uniquement).
#
#  Université de Dschang — projet.stigmergie@univ-dschang.org
# =============================================================================

[General]
network           = stigmergie.StigmergyNetwork
sim-time-limit    = 200s
repeat            = 30
seed-set          = ${repetition}

num-rngs          = 4
**.rng-0          = 0
**.rng-1          = 1
**.rng-2          = 2
**.rng-3          = 3

# =============================================================================
# SUPPRIMÉ : toute la section "Couche physique INET — 802.11 ad-hoc"
# *.radioMedium.*        → SUPPRIMÉ  (simple DomainNode n'a pas de wlan)
# *.domain[*].wlan[*].*  → SUPPRIMÉ  (provoquait "No such gate: socketOut")
# *.domain[*].mobility.* → SUPPRIMÉ  (simple DomainNode n'hérite pas d'AdhocHost)
# *.visualizer.*         → SUPPRIMÉ  (IntegratedCanvasVisualizer non requis)
# =============================================================================

# =============================================================================
# Paramètres réseau (niveau StigmergyNetwork)
# =============================================================================
*.numDomains      = 6
*.packetLoss      = 0.0
*.jammingProb     = 0.0
*.nodeFailureRate = 0.0
*.syncIntervalSec = 2.0

# =============================================================================
# Paramètres DomainNode — Stigmergie
# =============================================================================
*.domain[*].rhoP             = 0.1
*.domain[*].xi               = 0.5
*.domain[*].omegaDefault     = 0.8
*.domain[*].thetaTau         = 0.7
*.domain[*].quorumRatio      = 0.6
*.domain[*].rotationCooldown = 5

*.domain[*].budgetTotal      = 100.0
*.domain[0].costPerUnit      = 1.0
*.domain[1].costPerUnit      = 2.0
*.domain[2].costPerUnit      = 1.5
*.domain[3].costPerUnit      = 2.0
*.domain[4].costPerUnit      = 3.0
*.domain[5].costPerUnit      = 1.0

*.domain[*].narrativeOptions    = "A B C"
*.domain[*].beliefInit          = "uniform"
*.domain[*].suspicionThreshold  = 0.3
*.domain[*].probingIntensity    = "adaptive"
*.domain[*].gnnHiddenDim        = 16
*.domain[*].attentionLr         = 0.01
*.domain[*].syncIntervalSec     = 2.0

# =============================================================================
# Paramètres PheromoneField
# =============================================================================
*.pheromoneField.numDomains      = 6
*.pheromoneField.rhoP            = 0.1
*.pheromoneField.omegaDefault    = 0.8
*.pheromoneField.diffAlpha       = 0.05
*.pheromoneField.depositClamp    = 0.3
*.pheromoneField.noiseAmplitude  = 0.05
*.pheromoneField.jammingProb     = 0.0
*.pheromoneField.enableDiffusion = true
*.pheromoneField.evapPeriod      = 2.0

# =============================================================================
# Paramètres AdversaryModel
# =============================================================================
*.adversary.numDomains          = 6
*.adversary.beliefInit          = "uniform"
*.adversary.gnnHiddenDim        = 16
*.adversary.attentionLr         = 0.01
*.adversary.suspicionThreshold  = 0.3
*.adversary.probingIntensity    = "adaptive"
*.adversary.updatePeriod        = 2.0

# =============================================================================
# Paramètres MetricsCollector
# =============================================================================
*.metricsCollector.numDomains    = 6
*.metricsCollector.outputDir     = "results/processed"
*.metricsCollector.collectPeriod = 10.0
*.metricsCollector.hThresh       = 1.0
*.metricsCollector.omegaEpsilon  = 0.05
*.metricsCollector.writeCSV      = true

# =============================================================================
# Enregistrement des résultats
# =============================================================================
result-dir              = results/raw
output-scalar-file      = ${resultdir}/scalars-${configname}-${repetition}.sca
output-vector-file      = ${resultdir}/vectors-${configname}-${repetition}.vec
output-vector-precision = 9

**.scalar-recording = true
**.vector-recording = false

# Results A — Déception
**.deceptionEffort.vector-recording      = true
**.pheromoneLevel.vector-recording       = true
**.beliefEntropy.vector-recording        = true
**.falseGoalInduction.vector-recording   = true
**.deceptionPersistence.vector-recording = true
**.timeToSuspicion.vector-recording      = true

# Results B — Coordination
**.consistencyViolation.vector-recording  = true
**.narrativeDivergence.vector-recording   = true
**.syncDelay.vector-recording             = true
**.quorumTriggerSuccess.vector-recording  = true

# Results C — Réseau / Sécurité
**.commOverhead.vector-recording   = true
**.infoLeak.vector-recording       = true
**.spoofDetection.vector-recording = true

# Results D — Robustesse
**.performanceDrop.vector-recording     = true
**.gracefulDegradation.vector-recording = true

# PheromoneField global
**.fieldEntropy.vector-recording      = true
**.globalConsistency.vector-recording = true
**.fieldNorm.vector-recording         = true
**.evaporationLoss.vector-recording   = true


# =============================================================================
# BASELINES
# =============================================================================

[Config Baseline_CentralizedPPO]
description     = "B1 - Centralized PPO"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0
*.domain[*].xi              = 1.0
*.domain[*].syncIntervalSec = 0.1
*.domain[*].probingIntensity = "adaptive"
*.domain[*].quorumRatio     = 0.0
*.domain[*].rotationCooldown = 0
*.pheromoneField.rhoP        = 0.0
*.pheromoneField.enableDiffusion = true
*.pheromoneField.diffAlpha   = 1.0

[Config Baseline_StaticAllocation]
description     = "B2 - Static Allocation"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0
*.domain[*].xi              = 0.0
*.domain[*].rhoP            = 0.0
*.domain[*].syncIntervalSec = 9999s
*.domain[*].quorumRatio     = 1.1
*.domain[*].budgetTotal     = 100.0
*.domain[0].costPerUnit     = 1.0
*.domain[1].costPerUnit     = 1.0
*.domain[2].costPerUnit     = 1.0
*.domain[3].costPerUnit     = 1.0
*.domain[4].costPerUnit     = 1.0
*.domain[5].costPerUnit     = 1.0
*.pheromoneField.rhoP       = 0.0
*.pheromoneField.enableDiffusion = false

[Config Baseline_Independent]
description     = "B3 - Independent Deception"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0
*.domain[*].xi              = 0.5
*.domain[*].omegaDefault    = 0.0
*.domain[*].quorumRatio     = 1.1
*.domain[*].syncIntervalSec = 2.0
*.pheromoneField.enableDiffusion = false
*.pheromoneField.diffAlpha       = 0.0

[Config Baseline_GNNCoordinated]
description     = "B4 - GNN-Coordinated"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0
*.domain[*].syncIntervalSec = 10s
*.domain[*].xi              = 0.8
*.domain[*].omegaDefault    = 0.9
*.domain[*].quorumRatio     = 0.5
*.domain[*].gnnHiddenDim    = 16
*.domain[*].attentionLr     = 0.01
*.pheromoneField.enableDiffusion = true
*.pheromoneField.diffAlpha       = 0.3
*.pheromoneField.evapPeriod      = 10

[Config Baseline_Proposed]
description     = "B5 - Proposed Stigmergic"
extends         = General
*.packetLoss    = 0.0
*.jammingProb   = 0.0


# =============================================================================
# E1 — Synchronisation sans pertes
# =============================================================================
[Config E1_CentralizedPPO]
description = "E1 - B1 reseau ideal"
extends     = Baseline_CentralizedPPO

[Config E1_StaticAllocation]
description = "E1 - B2 reseau ideal"
extends     = Baseline_StaticAllocation

[Config E1_Independent]
description = "E1 - B3 reseau ideal"
extends     = Baseline_Independent

[Config E1_GNNCoordinated]
description = "E1 - B4 reseau ideal"
extends     = Baseline_GNNCoordinated

[Config E1_Proposed]
description = "E1 - Proposed Stigmergic reseau ideal (RQ3 RQ6)"
extends     = Baseline_Proposed


# =============================================================================
# E2 — Adaptativité à l'attention adverse (shift à t=100s)
# =============================================================================
[Config E2_CentralizedPPO]
description = "E2 - B1 shift adverse t=100s"
extends     = Baseline_CentralizedPPO
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_StaticAllocation]
description = "E2 - B2 shift adverse t=100s"
extends     = Baseline_StaticAllocation
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_Independent]
description = "E2 - B3 shift adverse t=100s"
extends     = Baseline_Independent
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_GNNCoordinated]
description = "E2 - B4 shift adverse t=100s"
extends     = Baseline_GNNCoordinated
*.domain[*].probingIntensity = "shift_at_t100"

[Config E2_Proposed]
description = "E2 - Proposed shift adverse t=100s (RQ4 RQ5)"
extends     = Baseline_Proposed
*.domain[*].probingIntensity = "shift_at_t100"


# =============================================================================
# E3 — Réseau dégradé (pertes + jamming)
# NOTE : *.domain[*].wlan[*] SUPPRIMÉ — pertes modélisées via PheromoneField.jammingProb
#        et paramètre *.packetLoss transmis à StigmergyNetwork (modèle abstrait)
# =============================================================================
[Config E3_Base]
extends         = General
*.packetLoss    = ${pl=0.1, 0.3}
*.jammingProb   = ${jp=0.0, 0.2}
*.pheromoneField.jammingProb    = ${jp}
*.pheromoneField.noiseAmplitude = 0.05
**.tau_drift.vector-recording        = true
**.adversarialNoise.vector-recording = true

[Config E3_CentralizedPPO]
description = "E3 - B1 reseau degrade"
extends     = E3_Base, Baseline_CentralizedPPO

[Config E3_StaticAllocation]
description = "E3 - B2 reseau degrade"
extends     = E3_Base, Baseline_StaticAllocation

[Config E3_Independent]
description = "E3 - B3 reseau degrade"
extends     = E3_Base, Baseline_Independent

[Config E3_GNNCoordinated]
description = "E3 - B4 reseau degrade"
extends     = E3_Base, Baseline_GNNCoordinated

[Config E3_Proposed]
description = "E3 - Proposed reseau degrade (RQ5)"
extends     = E3_Base, Baseline_Proposed


# =============================================================================
# E4 — Résilience aux pannes de nœuds
# NOTE : hasStatus retiré (paramètre INET non disponible sur simple module)
# =============================================================================
[Config E4_Base]
extends          = General
*.packetLoss     = 0.0
*.jammingProb    = 0.0
*.nodeFailureRate = ${nf=0.1, 0.2, 0.4}
**.performanceDrop.vector-recording     = true
**.gracefulDegradation.vector-recording = true

[Config E4_CentralizedPPO]
description = "E4 - B1 pannes noeuds"
extends     = E4_Base, Baseline_CentralizedPPO

[Config E4_StaticAllocation]
description = "E4 - B2 pannes noeuds"
extends     = E4_Base, Baseline_StaticAllocation

[Config E4_Independent]
description = "E4 - B3 pannes noeuds"
extends     = E4_Base, Baseline_Independent

[Config E4_GNNCoordinated]
description = "E4 - B4 pannes noeuds"
extends     = E4_Base, Baseline_GNNCoordinated

[Config E4_Proposed]
description = "E4 - Proposed pannes noeuds (RQ5 RQ6)"
extends     = E4_Base, Baseline_Proposed


# =============================================================================
# E5 — Scalabilité |D| ∈ {3, 6, 9, 12}
# NOTE : *.domain[*].mobility.* SUPPRIMÉ — positions non nécessaires pour simple module
# =============================================================================
[Config E5_Base]
extends          = General
*.packetLoss     = 0.0
*.jammingProb    = 0.0
*.numDomains     = ${nd=3, 6, 9, 12}
*.pheromoneField.numDomains   = ${nd}
*.adversary.numDomains        = ${nd}
*.metricsCollector.numDomains = ${nd}
*.domain[*].costPerUnit       = 1.5
**.commOverhead.vector-recording = true
**.fieldNorm.vector-recording    = true

[Config E5_CentralizedPPO]
description = "E5 - B1 scalabilite"
extends     = E5_Base, Baseline_CentralizedPPO

[Config E5_StaticAllocation]
description = "E5 - B2 scalabilite"
extends     = E5_Base, Baseline_StaticAllocation

[Config E5_Independent]
description = "E5 - B3 scalabilite"
extends     = E5_Base, Baseline_Independent

[Config E5_GNNCoordinated]
description = "E5 - B4 scalabilite"
extends     = E5_Base, Baseline_GNNCoordinated

[Config E5_Proposed]
description = "E5 - Proposed scalabilite (RQ1 RQ6)"
extends     = E5_Base, Baseline_Proposed


# =============================================================================
# Configurations de débogage
# =============================================================================
[Config Debug_Quick]
description     = "DEBUG - 1 run, 20s, logs verbeux"
extends         = General
sim-time-limit  = 20s
repeat          = 1
seed-set        = 42
**.cmdenv-log-level       = detail
*.domain[*].cmdenv-log-level      = detail
*.pheromoneField.cmdenv-log-level = detail
**.vector-recording = true
*.packetLoss    = 0.0
*.jammingProb   = 0.0

[Config Debug_ValidateTopology]
description     = "DEBUG - Validation topologie"
extends         = General
sim-time-limit  = 10s
repeat          = 1
seed-set        = 42
*.packetLoss    = 0.0
*.jammingProb   = 0.0

[Config Debug_SeedCheck]
description     = "DEBUG - Reproductibilite 3 runs seed=42"
extends         = General
sim-time-limit  = 50s
repeat          = 3
seed-set        = 42
*.packetLoss    = 0.0
*.jammingProb   = 0.0
